name: Historial de sets (semanal) y eventos prime (diario)

on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 0,2-6'
  workflow_dispatch:

jobs:
  historial:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Historial de precios
        if: github.event.schedule != '0 6 * * 0,2-6'
        working-directory: scripts/wfm
        run: python historial_sets.py

      - name: Eventos prime
        continue-on-error: true
        working-directory: scripts/wfm
        run: python eventos_prime.py

      - name: Commit si hay cambios
        run: |
          git config user.email "actions@github.com"
          git config user.name "Historial Bot"
          git add deploy/assets/json/historial_sets.json deploy/assets/json/eventos_prime.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "🤖 Historial de sets $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
