name: Contenido del juego (diario)

# pulls new game content from WFCD master and bumps the app cache versions
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: contenido
  cancel-in-progress: false

jobs:
  contenido:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'

      - name: Dependencias
        run: pip install pillow==12.3.0

      - name: Sincronizar con WFCD
        run: python scripts/actualizar_contenido.py

      - name: Tests de los datos
        run: >-
          node --test tests/catalog-parts.test.mjs tests/item-match-fuzz.test.mjs tests/rivens-service.test.mjs
          tests/component-siblings.test.mjs tests/riven-co-scaling.test.mjs tests/relics-service.test.mjs

      - name: Commit si hay contenido nuevo
        run: |
          git config user.email "actions@github.com"
          git config user.name "Contenido Bot"
          git add deploy/assets/json deploy/assets/relic_contents deploy/js/services/rivens/rivens.service.js scripts/contenido_pendiente.json
          if git diff --staged --quiet; then
            echo "WFCD no trae nada nuevo."
            exit 0
          fi
          git commit -m "🤖 Contenido del juego $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
