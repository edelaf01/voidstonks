name: Predicción precios prime (28 días)

on:
  workflow_dispatch:

concurrency:
  group: prediccion-prime
  cancel-in-progress: false

jobs:
  prediccion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo principal (deploy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pip==26.2.1 && pip install pandas==3.0.6 numpy==2.4.6 scikit-learn==1.9.1 scipy==1.18.0

      - name: Generar deploy/assets/json/prediccion_prime.json
        run: python scripts/wfm/prediccion_prime.py

      - name: Commit de la predicción
        run: |
          git config user.email "actions@github.com"
          git config user.name "ML Retrain Bot"
          git add deploy/assets/json/prediccion_prime.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la predicción; nada que commitear."
            exit 0
          fi
          git commit -m "🤖 Predicción precios prime $(date -u +%F)"
          git push
