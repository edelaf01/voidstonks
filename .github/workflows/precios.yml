name: Precios WFM

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/precios.yml'
  workflow_dispatch: {}

concurrency:
  group: precios-wfm
  cancel-in-progress: false

env:
  API: https://shrill-brook-d8aa.edelamf0.workers.dev

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/wfm/
            deploy/assets/json/arcanes_vosfor.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Fecha de hoy
        id: hoy
        run: echo "dia=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: relicsrun
          key: relicsrun-${{ github.run_id }}
          restore-keys: relicsrun-

      - name: Histórico diario de relics.run
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/wfm/relicsrun.py --carpeta relicsrun

      - name: Precios de arcanos desde relics.run y las estadísticas de warframe.market
        id: arcanos
        if: github.event.schedule != '0 16 * * *'
        run: python scripts/wfm/precios_arcanos.py --arcanos deploy/assets/json/arcanes_vosfor.json --salida precios_arcanos.json --catalogo catalogo_wfm.json --relicsrun relicsrun

      - name: Subir arcanos al worker
        if: ${{ !cancelled() && steps.arcanos.outcome == 'success' }}
        env:
          PRECIOS_SECRET: ${{ secrets.PRECIOS_SECRET }}
        run: |
          curl -fsS -X POST "$API/?type=precios_subir&tipo=arcanos" \
            -H "X-Precios-Secret: $PRECIOS_SECRET" -H "Content-Type: application/json" \
            --data-binary @precios_arcanos.json

      - name: Precios prime desde /top de warframe.market
        id: prime
        if: ${{ !cancelled() && steps.arcanos.outcome != 'failure' }}
        run: python scripts/wfm/precios_prime.py --catalogo catalogo_wfm.json --previos "$API/?type=prices_snapshot" --salida precios_prime.json

      - name: Subir prime al worker
        if: ${{ !cancelled() && steps.prime.outcome == 'success' }}
        env:
          PRECIOS_SECRET: ${{ secrets.PRECIOS_SECRET }}
        run: |
          curl -fsS -X POST "$API/?type=precios_subir&tipo=prime" \
            -H "X-Precios-Secret: $PRECIOS_SECRET" -H "Content-Type: application/json" \
            --data-binary @precios_prime.json

      - name: Reliquias intactas desde /top de warframe.market
        id: reliquias
        if: ${{ !cancelled() && steps.prime.outcome == 'success' && github.event.schedule != '0 16 * * *' }}
        run: python scripts/wfm/precios_prime.py --reliquias --catalogo catalogo_wfm.json --previos "$API/?type=prices_snapshot" --salida precios_reliquias.json

      - name: Subir reliquias al worker
        if: ${{ !cancelled() && steps.reliquias.outcome == 'success' }}
        env:
          PRECIOS_SECRET: ${{ secrets.PRECIOS_SECRET }}
        run: |
          curl -fsS -X POST "$API/?type=precios_subir&tipo=reliquias" \
            -H "X-Precios-Secret: $PRECIOS_SECRET" -H "Content-Type: application/json" \
            --data-binary @precios_reliquias.json

      - name: Comparar /top con relics.run
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python scripts/wfm/comparar_top.py --relicsrun relicsrun --catalogo catalogo_wfm.json --prime precios_prime.json --reliquias precios_reliquias.json --salida comparacion.json --resumen comparacion.md
          cat comparacion.md >> "$GITHUB_STEP_SUMMARY"

      - name: Tendencias a 7 y 30 días
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python scripts/wfm/tendencias.py --relicsrun relicsrun --catalogo catalogo_wfm.json --arcanos deploy/assets/json/arcanes_vosfor.json --salida tendencias.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: relicsrun-${{ steps.hoy.outputs.dia }}-${{ github.run_attempt }}
          path: |
            comparacion.json
            comparacion.md
            tendencias.json
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: relicsrun
          key: relicsrun-${{ github.run_id }}
