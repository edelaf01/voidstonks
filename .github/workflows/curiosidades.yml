name: Curiosidades de mercado (diario)

# daily refresh of deploy/assets/ml/curiosidades.json, apart from the weekly retrain
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: "Ventana de recencia en días (cuánto atrás mirar movimientos)"
        default: "21"

jobs:
  curiosidades:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Dependencias
        run: pip install pandas==3.0.6 numpy==2.4.6 requests==2.34.2

      - name: Descargar serie history
        working-directory: scripts-actu/ML-rivenvaluation
        env:
          VOIDSTONKS_WEAPONS: ${{ github.workspace }}/deploy/assets/json/cleaned_weapons.json
        run: python history_fetch.py

      - name: Generar curiosidades
        working-directory: scripts-actu/ML-rivenvaluation
        env:
          DEPLOY_ML_DIR: ${{ github.workspace }}/deploy/assets/ml
          CURIOS_DIAS: ${{ github.event.inputs.dias || '21' }}
        run: python curiosidades_gen.py

      - name: Commit si hay eventos nuevos
        run: |
          git config user.email "actions@github.com"
          git config user.name "Curiosidades Bot"
          git add deploy/assets/ml/curiosidades.json
          if git diff --staged --quiet; then
            echo "Sin movimientos nuevos; nada que commitear."
            exit 0
          fi
          git commit -m "🤖 Curiosidades de mercado $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
