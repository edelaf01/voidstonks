name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
  workflow_dispatch: {}   # permite lanzar el deploy a mano desde Actions > Deploy Site > Run workflow

# Evita que dos pushes seguidos lancen deploys en paralelo (y cancela el anterior).
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'deploy'
          # OJO: cambia "voidstonks" por el nombre EXACTO de tu proyecto de Pages
          # (Cloudflare dashboard > Workers & Pages > tu proyecto).
          command: pages deploy . --project-name=voidstonks
