name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
  workflow_dispatch: {}   # permite lanzar el deploy a mano desde Actions > Deploy Site > Run workflow
  # Los commits del bot de curiosidades usan el GITHUB_TOKEN por defecto, y GitHub NO dispara
  # workflows con pushes hechos con ese token (salvaguarda anti-recursión). Sin este disparador el
  # JSON se actualizaba en el repo pero la web seguía sirviendo el anterior hasta el siguiente push
  # humano. workflow_run se lanza al terminar el otro workflow, sin necesitar un PAT.
  workflow_run:
    workflows: ["Curiosidades de mercado (diario)", "Reentrenar Riven ML (banda cuantiles)", "Contenido del juego (diario)"]
    types: [completed]

# Evita que dos pushes seguidos lancen deploys en paralelo (y cancela el anterior).
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    # Dos guards para workflow_run, que es más laxo que `push`:
    #   - "completed" salta aunque el workflow anterior haya FALLADO -> se exige conclusion success.
    #   - se dispara sea cual sea la rama del run origen, y actions/checkout en ese contexto saca la
    #     rama por defecto: sin comprobar head_branch, un run manual en una feature branch acabaría
    #     publicando main. El disparador `push` ya está acotado a main; esto lo iguala.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # El paso de wrangler falla sin decir por qué cuando faltan los secretos ("npx failed with
      # exit code 1"): se comprueba antes, con un mensaje que se lea en la anotación del run.
      - name: Comprobar secretos de Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          faltan=""
          [ -z "$CF_API_TOKEN" ] && faltan="$faltan CF_API_TOKEN"
          [ -z "$CF_ACCOUNT_ID" ] && faltan="$faltan CF_ACCOUNT_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secretos:$faltan. Se crean en Settings > Secrets and variables > Actions (token con permiso 'Cloudflare Pages: Edit' y el Account ID del panel de Cloudflare)."
            exit 1
          fi
          echo "Secretos presentes."

      # Minifica el JS a dist/ (deploy/ conserva los comentarios). Ver scripts-actu/build-dist.mjs.
      - name: Build minified dist
        run: |
          npm install --no-save esbuild@0.24.0
          node scripts-actu/build-dist.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # Publica la copia minificada, no el fuente. El proyecto de Pages se llama
          # warframe-tool (dominios warframe-tool.pages.dev y voidstonks.com): con
          # --project-name=voidstonks wrangler no lo encontraba y salía con exit 1 en todos los
          # runs desde agosto, sin que la anotación dijera por qué.
          workingDirectory: 'dist'
          command: pages deploy . --project-name=warframe-tool
