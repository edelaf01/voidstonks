name: Deploy Site

# builds deploy/ into dist/ and publishes it to the warframe-tool pages project
on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
  workflow_dispatch: {}
  # bot pushes made with GITHUB_TOKEN never trigger push workflows
  workflow_run:
    workflows: ["Curiosidades de mercado (diario)", "Reentrenar Riven ML (banda cuantiles)", "Contenido del juego (diario)"]
    types: [completed]

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Comprobar secretos de Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          faltan=""
          [ -z "$CF_API_TOKEN" ] && faltan="$faltan CF_API_TOKEN"
          [ -z "$CF_ACCOUNT_ID" ] && faltan="$faltan CF_ACCOUNT_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secretos:$faltan. Se crean en Settings > Secrets and variables > Actions (token con permiso 'Cloudflare Pages: Edit' y el Account ID del panel de Cloudflare)."
            exit 1
          fi
          echo "Secretos presentes."

      - name: Build minified dist
        run: |
          pnpm install --frozen-lockfile
          node scripts-actu/build-dist.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy "$GITHUB_WORKSPACE/dist" --project-name=warframe-tool --branch=main --commit-hash="$GITHUB_SHA"
