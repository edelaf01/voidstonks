name: Reentrenar Riven ML (banda cuantiles)

# weekly retrain of the riven quantile model, publishes the browser bundle to deploy/assets/ml
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      xgb_n:
        description: "n_estimators del modelo full. VACÍO = presupuesto por cuantil (recomendado). Un número fuerza el mismo para los 5 y desactiva la mejora."
        default: ""
      slim_n:
        description: "n_estimators del modelo slim publicado (400 seguro; subir vigila el LÍMITE de 25MB de Cloudflare Pages en model_quantiles_slim.json)"
        default: "400"
      slim_depth:
        description: "max_depth del modelo slim (5 seguro/pequeño; 6 hincha el cuantiles a ~25MB y PETA el deploy)"
        default: "5"

concurrency:
  group: retrain-ml
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo principal (deploy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout dataset (repo del oráculo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: edelaf01/Voidstonks-cron
          path: _cron
          persist-credentials: false
          token: ${{ secrets.DATASET_READ_PAT || secrets.CRON_DATASET_PAT }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pip==26.2.1 && pip install xgboost==3.2.0 pandas==3.0.6 numpy==2.4.6 scikit-learn==1.9.1 requests==2.34.2

      - name: Descargar serie history (todas las armas)
        working-directory: scripts-actu/ML-rivenvaluation
        env:
          VOIDSTONKS_CSV: ${{ github.workspace }}/_cron/historial_precios/dataset_raw_ml.csv
        run: python history_fetch.py

      - name: Reentrenar + exportar bundle a deploy/assets/ml
        working-directory: scripts-actu/ML-rivenvaluation
        env:
          VOIDSTONKS_CSV: ${{ github.workspace }}/_cron/historial_precios/dataset_raw_ml.csv
          VOIDSTONKS_WEAPONS: ${{ github.workspace }}/deploy/assets/json/cleaned_weapons.json
          DEPLOY_ML_DIR: ${{ github.workspace }}/deploy/assets/ml
          # no default on purpose: any value overrides the per-quantile budget
          XGB_N: ${{ github.event.inputs.xgb_n }}
          SLIM_N: ${{ github.event.inputs.slim_n || '400' }}
          SLIM_DEPTH: ${{ github.event.inputs.slim_depth || '5' }}
          SLIM_EXPORT: '1'
          PRUEBAS: '0'
        run: python ML_local.py

      - name: Commit del bundle actualizado
        run: |
          git config user.email "actions@github.com"
          git config user.name "ML Retrain Bot"
          git add deploy/assets/ml/ \
                  scripts-actu/ML-rivenvaluation/metrics_history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el bundle; nada que commitear."
            exit 0
          fi
          git commit -m "🤖 Reentreno ML riven (banda cuantiles) $(date -u +%F)"
          git push
