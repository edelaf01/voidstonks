name: Precios de arcanos (diario)

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: precios-arcanos
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Script del cron
        uses: actions/checkout@v5
        with:
          repository: edelaf01/Voidstonks-cron
          path: _cron
          token: ${{ secrets.DATASET_READ_PAT || secrets.CRON_DATASET_PAT }}
          sparse-checkout: precios_arcanos.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Precios desde las estadísticas de warframe.market
        run: python _cron/precios_arcanos.py --arcanos deploy/assets/json/arcanes_vosfor.json --salida deploy/assets/json/precios_arcanos.json

      - name: Commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "Arcanos Bot"
          git add deploy/assets/json/precios_arcanos.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "🤖 Precios de arcanos $(date -u +%F)"
          git push
