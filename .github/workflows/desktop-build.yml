name: Build Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'desktop/electron/**'
      - 'scripts-actu/build-dist.mjs'
      - '.github/workflows/desktop-build.yml'
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            destino: --linux
            nombre: VoidStonks-linux
            fichero: desktop/electron/out/*.AppImage
          - os: windows-latest
            destino: --win
            nombre: VoidStonks-windows
            fichero: desktop/electron/out/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Minificar la app
        run: |
          pnpm install --frozen-lockfile
          node scripts-actu/build-dist.mjs

      - name: Dependencias de escritorio
        working-directory: desktop/electron
        run: pnpm install --frozen-lockfile

      - name: Versión de la release
        if: github.event_name == 'release'
        run: echo "VERSION_RELEASE=--config.extraMetadata.version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Empaquetar
        working-directory: desktop/electron
        run: pnpm exec electron-builder ${{ matrix.destino }} --publish never $VERSION_RELEASE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.fichero }}
          retention-days: 30

  publicar:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: instalables
          merge-multiple: true

      - name: Subir los instalables a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" instalables/* --clobber --repo "$GITHUB_REPOSITORY"
