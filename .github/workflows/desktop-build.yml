name: Build Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'desktop/electron/**'
      - 'scripts-actu/build-dist.mjs'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch: {}

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            destino: --linux
            nombre: VoidStonks-linux
            fichero: desktop/electron/out/*.AppImage
          - os: windows-latest
            destino: --win
            nombre: VoidStonks-windows
            fichero: desktop/electron/out/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Minificar la app
        run: |
          pnpm install --frozen-lockfile
          node scripts-actu/build-dist.mjs

      - name: Dependencias de escritorio
        working-directory: desktop/electron
        run: pnpm install --frozen-lockfile

      - name: Empaquetar
        working-directory: desktop/electron
        run: pnpm exec electron-builder ${{ matrix.destino }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.fichero }}
          retention-days: 30
