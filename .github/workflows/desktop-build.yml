name: Build Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'desktop/electron/**'
      - 'scripts-actu/build-dist.mjs'
      - '.github/workflows/desktop-build.yml'
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            destino: --linux
            nombre: VoidStonks-linux
            fichero: desktop/electron/out/*.AppImage
          - os: windows-latest
            destino: --win
            nombre: VoidStonks-windows
            fichero: desktop/electron/out/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Minificar la app
        run: |
          pnpm install --frozen-lockfile
          node scripts-actu/build-dist.mjs

      - name: Dependencias de escritorio
        working-directory: desktop/electron
        run: pnpm install --frozen-lockfile

      - name: Versión de la release
        if: github.event_name == 'release'
        run: echo "VERSION_RELEASE=--config.extraMetadata.version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Empaquetar
        working-directory: desktop/electron
        run: pnpm exec electron-builder ${{ matrix.destino }} --publish never $VERSION_RELEASE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.fichero }}
          retention-days: 30

  publicar:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instalables
          merge-multiple: true

      - name: Subir los instalables a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" instalables/* --clobber --repo "$GITHUB_REPOSITORY"
